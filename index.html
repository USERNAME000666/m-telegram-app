<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Тестовые товары
    const products = [
        { id: 1, title: "Разработка сайта", price: 5000, img: "https://via.placeholder.com/150" },
        { id: 2, title: "Telegram-бот", price: 3000, img: "https://via.placeholder.com/150" },
        { id: 3, title: "UI/UX Дизайн", price: 4000, img: "https://via.placeholder.com/150" },
        { id: 4, title: "Консультация", price: 1500, img: "https://via.placeholder.com/150" }
    ];

    const cart = {};

    function renderProducts() {
        const container = document.getElementById('products-container');
        if (!container) return;
        container.innerHTML = '';

        products.forEach(p => {
            const count = cart[p.id] || 0;
            const card = document.createElement('div');
            card.className = 'product-card';

            card.innerHTML = `
                <img src="${p.img}" class="product-img" alt="${p.title}">
                <div class="product-title">${p.title}</div>
                <div class="product-price">${p.price.toLocaleString()} ₽</div>
                <div class="controls">
                    ${count === 0 ? `
                        <button class="btn-add" onclick="updateCart(${p.id}, 1)">В корзину</button>
                    ` : `
                        <button class="counter-btn" onclick="updateCart(${p.id}, -1)">-</button>
                        <span class="count-display">${count}</span>
                        <button class="counter-btn" onclick="updateCart(${p.id}, 1)">+</button>
                    `}
                </div>
            `;
            container.appendChild(card);
        });

        updateCartBar();
    }

    function updateCart(productId, delta) {
        const current = cart[productId] || 0;
        const newCount = current + delta;

        if (newCount > 0) {
            cart[productId] = newCount;
        } else {
            delete cart[productId];
        }

        renderProducts();
    }

    function updateCartBar() {
        const cartBar = document.getElementById('cart-bar');
        let totalCount = 0;
        let totalPrice = 0;

        Object.keys(cart).forEach(id => {
            const product = products.find(p => p.id == id);
            const count = cart[id];
            totalCount += count;
            totalPrice += product.price * count;
        });

        if (totalCount > 0) {
            cartBar.classList.remove('hidden');
            document.getElementById('total-count').innerText = totalCount;
            document.getElementById('total-price').innerText = totalPrice.toLocaleString() + ' ₽';
        } else {
            cartBar.classList.add('hidden');
        }
    }

    // Безопасный обработчик отправки заказа
    document.getElementById('cart-bar').addEventListener('click', () => {
        try {
            const orderItems = Object.keys(cart).map(id => {
                const product = products.find(p => p.id == id);
                return {
                    id: product.id,
                    title: product.title,
                    price: product.price,
                    count: cart[id]
                };
            });

            const orderData = {
                items: orderItems,
                total: orderItems.reduce((sum, item) => sum + (item.price * item.count), 0)
            };

            // Отправляем данные в Telegram
            tg.sendData(JSON.stringify(orderData));
            
            // Закрываем окно Mini App
            tg.close();
        } catch (e) {
            alert("Ошибка клика: " + e.message);
        }
    });

    renderProducts();
</script>
