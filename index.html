<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const API_URL = "https://hcbux-2a05-45c2-41bb-1d01-d888-ddc2-17ab-18a6.run.pinggy-free.link/api/products";

    let products = [];
    const cart = {};

    // Загрузка товаров из БД через FastAPI
    async function loadProducts() {
        try {
            const response = await fetch(API_URL);
            products = await response.json();
            renderProducts();
        } catch (e) {
            console.error("Ошибка загрузки товаров из БД:", e);
        }
    }

    function renderProducts() {
        const container = document.getElementById('products-container');
        if (!container) return;
        container.innerHTML = '';

        products.forEach(p => {
            const count = cart[p.id] || 0;
            const card = document.createElement('div');
            card.className = 'product-card';

            card.innerHTML = `
                <img src="${p.img}" class="product-img" alt="${p.title}">
                <div class="product-title">${p.title}</div>
                <div class="product-price">${p.price.toLocaleString()} ₽</div>
                <div class="controls">
                    ${count === 0 ? `
                        <button class="btn-add" onclick="updateCart(${p.id}, 1)">В корзину</button>
                    ` : `
                        <button class="counter-btn" onclick="updateCart(${p.id}, -1)">-</button>
                        <span class="count-display">${count}</span>
                        <button class="counter-btn" onclick="updateCart(${p.id}, 1)">+</button>
                    `}
                </div>
            `;
            container.appendChild(card);
        });

        updateCartBar();
    }

    function updateCart(productId, delta) {
        const current = cart[productId] || 0;
        const newCount = current + delta;

        if (newCount > 0) {
            cart[productId] = newCount;
        } else {
            delete cart[productId];
        }

        renderProducts();
    }

    function updateCartBar() {
        const cartBar = document.getElementById('cart-bar');
        let totalCount = 0;
        let totalPrice = 0;

        Object.keys(cart).forEach(id => {
            const product = products.find(p => p.id == id);
            if (product) {
                const count = cart[id];
                totalCount += count;
                totalPrice += product.price * count;
            }
        });

        if (totalCount > 0) {
            cartBar.classList.remove('hidden');
            document.getElementById('total-count').innerText = totalCount;
            document.getElementById('total-price').innerText = totalPrice.toLocaleString() + ' ₽';
        } else {
            cartBar.classList.add('hidden');
        }
    }

    // Обработчик отправки заказа
    document.getElementById('cart-bar').addEventListener('click', () => {
        try {
            const orderItems = Object.keys(cart).map(id => {
                const product = products.find(p => p.id == id);
                return {
                    id: product.id,
                    title: product.title,
                    price: product.price,
                    count: cart[id]
                };
            });

            const orderData = {
                items: orderItems,
                total: orderItems.reduce((sum, item) => sum + (item.price * item.count), 0)
            };

            tg.sendData(JSON.stringify(orderData));
            tg.close();
        } catch (e) {
            alert("Ошибка клика: " + e.message);
        }
    });

    // Запускаем автоматическую загрузку товаров при старте
    loadProducts();
</script>
