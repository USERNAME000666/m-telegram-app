<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--tg-theme-hint-color, #888);
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 12px;
            box-sizing: border-box;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="greeting">Оформление заявки</h2>
        
        <label for="service">Выберите услугу:</label>
        <select id="service">
            <option value="Разработка сайта" data-price="5000">Разработка сайта (5 000 ₽)</option>
            <option value="Создание Telegram-бота" data-price="3000">Создание Telegram-бота (3 000 ₽)</option>
            <option value="Дизайн интерфейса" data-price="4000">Дизайн интерфейса (4 000 ₽)</option>
        </select>

        <label for="comment">Комментарий к тексту/ТЗ:</label>
        <input type="text" id="comment" placeholder="Например: Нужен сайт-визитка">
    </div>

    <button id="submit-btn">Отправить заявку</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Подставляем имя пользователя
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('greeting').innerText = `Заявка от ${tg.initDataUnsafe.user.first_name}`;
        }

        // Обработка клика по кнопке
        document.getElementById('submit-btn').addEventListener('click', () => {
            const serviceSelect = document.getElementById('service');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            
            const orderData = {
                service: selectedOption.value,
                price: selectedOption.getAttribute('data-price'),
                comment: document.getElementById('comment').value || "Без комментария"
            };

            // Отправляем структурированный JSON боту
            tg.sendData(JSON.stringify(orderData));
        });
    </script>
</body>
</html>
