<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VELO TASH</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f8f9fa);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #212529);
            --hint-color: var(--tg-theme-hint-color, #6c757d);
            --button-color: var(--tg-theme-button-color, #007bff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            padding: 16px 16px 8px;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        header img {
            max-width: 140px;
            height: auto;
            border-radius: 8px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px 16px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .product-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .btn-add {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: var(--button-color);
            color: var(--button-text-color);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-add:disabled {
            background: #ccc;
            color: #666;
            cursor: not-allowed;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            border-radius: 8px;
            padding: 2px;
        }

        .btn-qty {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-count {
            font-size: 14px;
            font-weight: 600;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <header>
        <img src="/static/logo.jpg" alt="VELO TASH" onerror="this.style.display='none'">
    </header>

    <div id="loader" class="loader">Загрузка каталога...</div>
    <div class="products-grid" id="products-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let allProducts = [];
        let cart = {};

        const formatPrice = (price) => {
            return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " сум";
        };

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                allProducts = await response.json();
                document.getElementById('loader').style.display = 'none';
                renderProducts();
            } catch (err) {
                document.getElementById('loader').innerText = 'Ошибка загрузки каталога';
                console.error(err);
            }
        }

        function renderProducts() {
            const container = document.getElementById('products-container');

            container.innerHTML = allProducts.map(p => {
                const qty = cart[p.id] || 0;
                const isAvailable = p.in_stock === 1;

                return `
                    <div class="product-card">
                        <div>
                            <img src="${p.img || 'https://via.placeholder.com/150'}" class="product-img" alt="${p.title}">
                            <div class="product-title">${p.title}</div>
                        </div>
                        <div>
                            <div class="product-price">${formatPrice(p.price)}</div>
                            ${!isAvailable ? `
                                <button class="btn-add" disabled>Нет в наличии</button>
                            ` : qty === 0 ? `
                                <button class="btn-add" onclick="updateQty(${p.id}, 1)">В корзину</button>
                            ` : `
                                <div class="cart-controls">
                                    <button class="btn-qty" onclick="updateQty(${p.id}, -1)">-</button>
                                    <span class="qty-count">${qty}</span>
                                    <button class="btn-qty" onclick="updateQty(${p.id}, 1)">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateQty(id, delta) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            const currentQty = cart[id] || 0;
            const newQty = currentQty + delta;

            if (newQty <= 0) {
                delete cart[id];
            } else {
                cart[id] = newQty;
            }

            renderProducts();
            updateMainButton();
        }

        function updateMainButton() {
            const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
            
            if (totalItems > 0) {
                let totalPrice = 0;
                for (const [id, qty] of Object.entries(cart)) {
                    const p = allProducts.find(item => item.id == id);
                    if (p) totalPrice += p.price * qty;
                }
                
                tg.MainButton.text = `Оформить заказ (${formatPrice(totalPrice)})`;
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        tg.onEvent('mainButtonClicked', async () => {
            tg.MainButton.showProgress();

            const items = Object.entries(cart).map(([id, qty]) => {
                const p = allProducts.find(item => item.id == id);
                return {
                    product_id: parseInt(id),
                    title: p.title,
                    price: p.price,
                    count: qty
                };
            });

            const orderData = {
                user_id: tg.initDataUnsafe?.user?.id,
                username: tg.initDataUnsafe?.user?.username || "Неизвестный",
                items: items
            };

            try {
                const response = await fetch('/api/order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    tg.close();
                } else {
                    tg.showAlert('Ошибка создания заказа');
                    tg.MainButton.hideProgress();
                }
            } catch (err) {
                tg.showAlert('Ошибка сети');
                tg.MainButton.hideProgress();
            }
        });

        loadProducts();
    </script>
</body>
</html>
