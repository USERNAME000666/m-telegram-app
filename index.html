<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            padding: 16px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .requisites {
            background: rgba(36, 129, 204, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 14px;
        }
        label { display: block; font-size: 14px; margin-bottom: 6px; color: #888; }
        select { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
        button {
            width: 100%; padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Оформление заказа</h2>
        
        <label>Выберите услугу:</label>
        <select id="service">
            <option value="Разработка сайта" data-price="5000">Разработка сайта (5 000 ₽)</option>
            <option value="Telegram-бот" data-price="3000">Telegram-бот (3 000 ₽)</option>
        </select>

        <div class="requisites">
            <strong>💳 Реквизиты для оплаты:</strong><br>
            Карта: <code>2200 0000 0000 0000</code> (Сбер / T-Bank)<br>
            Получатель: Иван И.
        </div>
    </div>

    <button id="submit-btn">Перейти к оплате</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('submit-btn').addEventListener('click', () => {
            const serviceSelect = document.getElementById('service');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];

            const orderData = {
                service: selectedOption.value,
                price: selectedOption.getAttribute('data-price')
            };

            tg.sendData(JSON.stringify(orderData));
        });
    </script>
</body>
</html>
