<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            padding: 16px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .requisites {
            background: rgba(36, 129, 204, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-size: 14px;
        }
        label { display: block; font-size: 14px; margin-bottom: 6px; color: #888; }
        select, input[type="file"] { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
        button {
            width: 100%; padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        #status { text-align: center; color: #888; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Оформление и оплата</h2>
        
        <label>Выберите услугу:</label>
        <select id="service">
            <option value="Разработка сайта" data-price="5000">Разработка сайта (5 000 ₽)</option>
            <option value="Telegram-бот" data-price="3000">Telegram-бот (3 000 ₽)</option>
        </select>

        <div class="requisites">
            <strong>💳 Реквизиты для оплаты:</strong><br>
            Карта: <code>2200 0000 0000 0000</code> (Сбер / T-Bank)<br>
            Получатель: Иван И.
        </div>

        <label>Прикрепите скриншот чека:</label>
        <input type="file" id="receipt" accept="image/*">
    </div>

    <button id="submit-btn">Отправить чек на проверку</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_TOKEN = "8761549728:AAFd7jTYJIlQPWs86Yv2XvM2mJ_fjtKiNx0"; // Ваш токен

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const fileInput = document.getElementById('receipt');
            const statusDiv = document.getElementById('status');
            
            if (!fileInput.files[0]) {
                alert("Пожалуйста, прикрепите скриншот чека!");
                return;
            }

            const serviceSelect = document.getElementById('service');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const userId = tg.initDataUnsafe?.user?.id || "Неизвестно";
            const userName = tg.initDataUnsafe?.user?.first_name || "Пользователь";

            statusDiv.innerText = "Отправка чека...";

            // Собираем данные формы и фото
            const formData = new FormData();
            formData.append('chat_id', userId);
            formData.append('photo', fileInput.files[0]);
            formData.append('caption', `🧾 **Новый чек на проверку!**\n\n👤 Пользователь: ${userName} (ID: \`${userId}\`)\n📌 Услуга: ${selectedOption.value}\n💰 Сумма: ${selectedOption.getAttribute('data-price')} ₽`);
            formData.append('parse_mode', 'Markdown');

            try {
                // Отправляем фото напрямую в бот к пользователю (он перенаправит его админу)
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    tg.close(); // Закрываем Mini App после успешной отправки
                } else {
                    statusDiv.innerText = "Ошибка отправки. Попробуйте еще раз.";
                }
            } catch (err) {
                statusDiv.innerText = "Ошибка сети.";
            }
        });
    </script>
</body>
</html>
