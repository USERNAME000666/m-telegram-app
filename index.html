<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VELO TASH</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--card:#f3f3f3;--text:#111;--muted:#7a7a7a;--accent:#111;--on-accent:#fff;--line:rgba(0,0,0,.08)}
[data-theme=dark]{--bg:#0d0d0d;--card:#1a1a1a;--text:#f2f2f2;--muted:#8d8d8d;--accent:#f2f2f2;--on-accent:#111;--line:rgba(255,255,255,.1)}
[data-theme=dark] .logo{filter:invert(1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:96px}
header{text-align:center;padding:18px 16px 6px}
.logo{height:92px;width:auto}
.search{margin:8px 16px 0}
.search input{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px}
.card{background:var(--card);border-radius:18px;padding:10px;display:flex;flex-direction:column;justify-content:space-between}
.imgwrap{position:relative;margin-bottom:10px}
.pimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--line);display:block}
.off .pimg{filter:grayscale(1);opacity:.55}
.badge{position:absolute;left:8px;top:8px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px}
.title{font-size:14px;font-weight:700;line-height:1.25;margin-bottom:4px}
.desc{font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;cursor:pointer}
.desc.open{-webkit-line-clamp:unset;display:block}
.price{font-size:16px;font-weight:800;margin-bottom:8px}
.btn{width:100%;padding:11px;border-radius:12px;border:none;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;cursor:pointer}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:3px}
.qty button{width:38px;height:36px;border-radius:9px;border:none;background:var(--card);color:var(--text);font-size:18px;font-weight:700;cursor:pointer}
.qty span{font-size:15px;font-weight:700}
.msg{text-align:center;color:var(--muted);padding:40px 16px}
.warn{margin:8px 16px 0;text-align:center;font-size:11px;color:var(--muted);line-height:1.4}
#gate{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate .logo{height:130px}
#gate h2{font-size:22px;font-weight:800}
#gate p{font-size:13px;color:var(--muted);max-width:300px;line-height:1.45}
#gate .btn{max-width:300px}
#gate .btn.ghost{background:transparent;color:var(--muted);font-weight:600}
.hidden{display:none!important}
</style>
</head>

  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' сум';
const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#ddd"/><text x="100" y="112" font-size="34" text-anchor="middle" fill="#999" font-family="Arial" font-weight="700">VT</text></svg>');
const tap = () => { try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} };

// Проверка возраста
const gate = document.getElementById('gate');
if (store.get('velo_age_ok') === '1') gate.classList.add('hidden');
document.getElementById('age-yes').onclick = () => { store.set('velo_age_ok', '1'); gate.classList.add('hidden'); };
document.getElementById('age-no').onclick = () => tg.close();

let products = [], cart = {}, mode = 'all', query = '';

async function load() {
  try {
    const r = await fetch('/api/products');
    products = await r.json();
    document.getElementById('loader').classList.add('hidden');
    render();
  } catch (e) {
    document.getElementById('loader').textContent = 'Ошибка загрузки каталога';
  }
}

function visible() {
  let list = products.filter(p => p.title.toLowerCase().includes(query));
  if (mode === 'stock') list = list.filter(p => p.in_stock);
  if (mode === 'asc') list = [...list].sort((a, b) => a.price - b.price);
  if (mode === 'desc') list = [...list].sort((a, b) => b.price - a.price);
  return list;
}

function render() {
  const list = visible();
  const grid = document.getElementById('grid');
  if (!list.length) { grid.innerHTML = '<div class="msg" style="grid-column:1/-1">Ничего не найдено</div>'; return; }
  grid.innerHTML = list.map(p => {
    const q = cart[p.id] || 0, ok = !!p.in_stock, d = (p.description || '').trim();
    return `<div class="card ${ok ? '' : 'off'}">
      <div>
        <div class="imgwrap">
          <img class="pimg" src="${esc(p.img) || PH}" alt="${esc(p.title)}" loading="lazy" onerror="this.onerror=null;this.src=PH">
          ${ok ? '' : '<span class="badge">Нет в наличии</span>'}
        </div>
        <div class="title">${esc(p.title)}</div>
        ${d ? `<div class="desc" onclick="this.classList.toggle('open')">${esc(d)}</div>` : ''}
      </div>
      <div>
        <div class="price">${fmt(p.price)}</div>
        ${!ok ? '<button class="btn" disabled>Нет в наличии</button>'
          : q === 0 ? `<button class="btn" onclick="change(${p.id},1)">В корзину</button>`
          : `<div class="qty"><button onclick="change(${p.id},-1)">−</button><span>${q}</span><button onclick="change(${p.id},1)">+</button></div>`}
      </div>
    </div>`;
  }).join('');
}

function change(id, delta) {
  const n = (cart[id] || 0) + delta;
  if (n <= 0) delete cart[id]; else cart[id] = n;
  tap(); render(); updateMain();
}

function updateMain() {
  const count = Object.values(cart).reduce((a, b) => a + b, 0);
  if (!count) { tg.MainButton.hide(); return; }
  let total = 0;
  for (const [id, q] of Object.entries(cart)) {
    const p = products.find(x => x.id == id);
    if (p) total += p.price * q;
  }
  tg.MainButton.setParams({
    text: `Оформить заказ (${fmt(total)})`,
    color: dark ? '#f2f2f2' : '#111111',
    text_color: dark ? '#111111' : '#ffffff'
  });
  tg.MainButton.show();
}

document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  mode = c.dataset.mode;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === c));
  render();
});

tg.onEvent('mainButtonClicked', async () => {
  tg.MainButton.showProgress();
  const items = Object.entries(cart).map(([id, q]) => {
    const p = products.find(x => x.id == id);
    return { product_id: parseInt(id), title: p.title, price: p.price, count: q };
  });
  const orderData = {
    user_id: tg.initDataUnsafe?.user?.id,
    username: tg.initDataUnsafe?.user?.username || 'Неизвестный',
    items
  };
  try {
    const r = await fetch('/api/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderData) });
    if (r.ok) tg.close();
    else { tg.showAlert('Ошибка создания заказа'); tg.MainButton.hideProgress(); }
  } catch (e) {
    tg.showAlert('Ошибка сети'); tg.MainButton.hideProgress();
  }
});

load();
</script>
</body>
</html>
