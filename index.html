<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            border: 1px solid var(--tg-theme-hint-color, #e0e0e0);
            border-radius: 12px;
            padding: 10px;
            background: var(--tg-theme-secondary-bg-color, #f9f9f9);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .card .title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .card .price {
            color: #2ea6ff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .btn-add {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .counter button {
            background-color: #e0e0e0;
            border: none;
            border-radius: 4px;
            width: 24px;
            height: 24px;
            font-weight: bold;
        }

        #loading {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>🛍️ Наш Каталог</h2>
    <div id="loading">Загрузка товаров...</div>
    <div class="products-grid" id="products-list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setText("ОФОРМИТЬ ЗАКАЗ");
        tg.MainButton.hide();

        // ⚠️ ЗАМЕНИТЕ НА ВАШ АКТУАЛЬНЫЙ АДРЕС ИЗ КОНСОЛИ NGROK:
        const API_URL = "https://ВАШ-ДОМЕН.ngrok-free.app";

        let cart = {};
        let products = [];

        async function fetchProducts() {
            try {
                // Добавлен заголовок ngrok-skip-browser-warning для обхода промежуточного экрана ngrok
                const response = await fetch(`${API_URL}/api/products`, {
                    headers: {
                        "ngrok-skip-browser-warning": "true"
                    }
                });
                products = await response.json();
                document.getElementById('loading').style.display = 'none';
                renderProducts();
            } catch (error) {
                console.error("Ошибка загрузки товаров:", error);
                document.getElementById('loading').innerText = "⚠️ Ошибка подключения к серверу";
            }
        }

        function renderProducts() {
            const list = document.getElementById('products-list');
            list.innerHTML = '';

            products.forEach(p => {
                const count = cart[p.id] ? cart[p.id].count : 0;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${p.img}" alt="${p.title}">
                    <div class="title">${p.title}</div>
                    <div class="price">${p.price} ₽</div>
                    ${count === 0 
                        ? `<button class="btn-add" onclick="addToCart(${p.id})">Добавить</button>`
                        : `<div class="counter">
                             <button onclick="changeCount(${p.id}, -1)">-</button>
                             <span>${count}</span>
                             <button onclick="changeCount(${p.id}, 1)">+</button>
                           </div>`
                    }
                `;
                list.appendChild(card);
            });

            updateMainButton();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart[id] = { ...product, count: 1 };
            renderProducts();
        }

        function changeCount(id, delta) {
            if (cart[id]) {
                cart[id].count += delta;
                if (cart[id].count <= 0) {
                    delete cart[id];
                }
            }
            renderProducts();
        }

        function updateMainButton() {
            const items = Object.values(cart);
            if (items.length > 0) {
                const total = items.reduce((sum, item) => sum + (item.price * item.count), 0);
                tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ (${total} ₽)`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            const items = Object.values(cart);
            const total = items.reduce((sum, item) => sum + (item.price * item.count), 0);
            
            tg.sendData(JSON.stringify({
                items: items,
                total: total
            }));
        });

        fetchProducts();
    </script>
</body>
</html>
