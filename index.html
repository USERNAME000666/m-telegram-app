<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VELO TASH</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #18181c;
            --accent-color: #00e5ff;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --danger-color: #ff3b30;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
            user-select: none;
        }

        /* Шапка магазина */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 12px;
            background: linear-gradient(180deg, #18181c 0%, var(--bg-color) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #fff;
            padding: 4px;
            object-fit: contain;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: -2px;
        }

        /* Поиск */
        .search-container {
            width: 100%;
            max-width: 500px;
            margin-top: 8px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-img-wrapper {
            width: 100%;
            padding-top: 100%;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 10px;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 6px;
            color: #efefef;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 36px;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .out-of-stock-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 59, 48, 0.85);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        /* Кнопки управления корзиной */
        .cart-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 2px;
        }

        .btn-add {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-add:disabled {
            background: #3a3a3c;
            color: #8e8e93;
            cursor: not-allowed;
        }

        .btn-qty {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-count {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        /* Лоадер */
        .loader {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
            grid-column: span 2;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Ссылка на ваше загруженное лого -->
            <img src="logo.jpg" alt="VELO TASH" class="logo-icon" onerror="this.style.display='none'">
            <div>
                <div class="brand-title">VELO TASH</div>
                <div class="brand-subtitle">STORE TASHKENT</div>
            </div>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по каталогу..." oninput="filterProducts()">
        </div>
    </header>

    <main class="products-grid" id="productsGrid">
        <div class="loader">⏳ Загрузка товаров...</div>
    </main>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // Базовый URL вашего API сервера Uvicorn/Pinggy
        const API_URL = window.location.origin.includes('github') 
            ? "https://your-pinggy-or-tunnel-url.loca.lt"  // Укажите ваш актуальный туннель Pinggy
            : ""; 

        let allProducts = [];
        let cart = {}; // { productId: count }

        // Загрузка товаров
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_URL}/api/products`);
                if (!res.ok) throw new Error('Ошибка сети');
                allProducts = await res.json();
                renderProducts(allProducts);
            } catch (err) {
                console.error(err);
                document.getElementById('productsGrid').innerHTML = `
                    <div class="empty-state">
                        ⚠️ Не удалось загрузить товары.<br>Убедитесь, что сервер бота запущен.
                    </div>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = `<div class="empty-state">Товары не найдены 🔍</div>`;
                return;
            }

            grid.innerHTML = products.map(p => {
                const qty = cart[p.id] || 0;
                const isAvailable = p.in_stock !== false && p.in_stock !== 0;

                return `
                    <div class="product-card">
                        ${!isAvailable ? '<div class="out-of-stock-badge">Нет в наличии</div>' : ''}
                        <div class="product-img-wrapper">
                            <img src="${p.img.startsWith('/') ? API_URL + p.img : p.img}" class="product-img" alt="${p.title}" loading="lazy">
                        </div>
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price.toLocaleString('ru-RU')} сум</div>
                        
                        <div>
                            ${!isAvailable ? `
                                <button class="btn-add" disabled>Распродано</button>
                            ` : qty === 0 ? `
                                <button class="btn-add" onclick="updateQty(${p.id}, 1)">В корзину</button>
                            ` : `
                                <div class="cart-controls">
                                    <button class="btn-qty" onclick="updateQty(${p.id}, -1)">-</button>
                                    <span class="qty-count">${qty}</span>
                                    <button class="btn-qty" onclick="updateQty(${p.id}, 1)">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateQty(id, delta) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            const current = cart[id] || 0;
            const next = current + delta;

            if (next <= 0) {
                delete cart[id];
            } else {
                cart[id] = next;
            }

            renderProducts(allProducts);
            updateMainButton();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.title.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function updateMainButton() {
            let totalCount = 0;
            let totalPrice = 0;

            for (const [id, count] of Object.entries(cart)) {
                const prod = allProducts.find(p => p.id == id);
                if (prod) {
                    totalCount += count;
                    totalPrice += prod.price * count;
                }
            }

            if (totalCount > 0) {
                tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ • ${totalPrice.toLocaleString('ru-RU')} сум`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // Клик по главной кнопке Telegram "Оформить заказ"
        tg.MainButton.onClick(async () => {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            const orderItems = [];
            let total = 0;

            for (const [id, count] of Object.entries(cart)) {
                const prod = allProducts.find(p => p.id == id);
                if (prod) {
                    orderItems.push({
                        id: prod.id,
                        title: prod.title,
                        price: prod.price,
                        count: count
                    });
                    total += prod.price * count;
                }
            }

            const user = tg.initDataUnsafe?.user || {};
            const payload = {
                user_id: user.id || 0,
                username: user.username ? `@${user.username}` : (user.first_name || "Неизвестный"),
                items: orderItems,
                total: total
            };

            tg.MainButton.showProgress();

            try {
                const res = await fetch(`${API_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    tg.close();
                } else {
                    alert('Ошибка оформления заказа. Попробуйте еще раз.');
                    tg.MainButton.hideProgress();
                }
            } catch (e) {
                alert('Не удалось связаться с сервером магазина.');
                tg.MainButton.hideProgress();
            }
        });

        // Запуск
        fetchProducts();
    </script>
</body>
</html>
